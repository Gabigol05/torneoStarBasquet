  <body>
    <div id="root"></div>
    <!-- Recuperación de "pantalla negra": si durante un deploy el navegador
         llegó a guardar un 404 para el JS/CSS nuevo, la app no arranca. Si a los
         pocos segundos #root sigue vacío (o falla la carga de un script/estilo),
         se vuelven a pedir esos archivos salteando la caché y se recarga UNA vez. -->
    <script>
      (function () {
        var KEY = 'ts-recupero';
        function recuperar() {
          try { if (sessionStorage.getItem(KEY)) return; sessionStorage.setItem(KEY, '1'); } catch (e) {}
          var urls = [];
          document.querySelectorAll('script[type="module"][src], link[rel="stylesheet"][href], link[rel="modulepreload"][href]').forEach(function (el) {
            urls.push(el.src || el.href);
          });
          Promise.all(urls.map(function (u) { return fetch(u, { cache: 'reload' }).catch(function () {}); }))
            .then(function () {
              if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
                return navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { r.update(); }); });
              }
            })
            .catch(function () {})
            .then(function () { location.reload(); });
        }
        // Solo cuentan los archivos propios del sitio (/assets/...): antes
        // cualquier falla externa (por ejemplo Google Fonts sin conexión o
        // bloqueado) recargaba la página entera sin motivo.
        function propio(u) {
          try { var x = new URL(u, location.href); return x.origin === location.origin && x.pathname.indexOf('/assets/') === 0; }
          catch (e) { return false; }
        }
        window.addEventListener('error', function (e) {
          var t = e && e.target;
          if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK') && propio(t.src || t.href)) recuperar();
        }, true);
        // Con internet lento el JS puede tardar más de 6 s en bajar: antes se
        // recargaba igual y la descarga arrancaba de cero. Ahora solo se
        // recupera si el JS YA terminó de bajar y aun así no arrancó (o si
        // pasaron más de 30 s).
        function revisar(n) {
          var root = document.getElementById('root');
          if (root && root.children.length > 0) { try { sessionStorage.removeItem(KEY); } catch (e) {} return; }
          var s = document.querySelector('script[type="module"][src]');
          var bajo = s && window.performance && performance.getEntriesByName && performance.getEntriesByName(s.src).length > 0;
          if (bajo || n >= 8) recuperar();
          else setTimeout(function () { revisar(n + 1); }, 3000);
        }
        setTimeout(function () { revisar(0); }, 6000);
      })();
    </script>
